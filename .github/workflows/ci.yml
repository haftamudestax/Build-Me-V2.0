name: CI

on:
  push:
    branches:
      - main
      - development

  pull_request:
    branches:
      - main
      - development

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install Playwright Browsers
        run: pnpm --filter @build-me/web exec playwright install --with-deps chromium

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Verify k6 Installation
        run: k6 version

      - name: Lint
        run: pnpm turbo run lint

      - name: Type Check
        run: pnpm turbo run typecheck

      - name: Run Python Analytics Tests
        working-directory: services/analytics
        env:
          PYTHONPATH: ${{ github.workspace }}/services/analytics
        run: uv run pytest ../../tests/analytics/ -v

      - name: Start API for Performance Tests
        shell: bash
        run: |
          pnpm --filter @build-me/api dev > /tmp/build-me-api.log 2>&1 &
          API_PID=$!
          echo "$API_PID" > /tmp/build-me-api.pid

          for i in {1..30}; do
            if curl --fail --silent http://localhost:4000/health; then
              echo "API is ready"
              exit 0
            fi

            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "API process exited unexpectedly."
              cat /tmp/build-me-api.log
              exit 1
            fi

            sleep 2
          done

          echo "API failed to start or health check failed."
          cat /tmp/build-me-api.log
          exit 1

      - name: Run Tests
        run: pnpm turbo run test --filter='!@build-me/integration-tests'

      - name: Build
        run: pnpm turbo run build

      - name: Stop API
        if: always()
        shell: bash
        run: |
          if [ -f /tmp/build-me-api.pid ]; then
            kill "$(cat /tmp/build-me-api.pid)" 2>/dev/null || true
          fi
