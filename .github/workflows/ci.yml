name: CI

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: build_me_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d build_me_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/build_me_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/build_me_test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/analytics/uv.lock

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Push Database Schema
        run: pnpm --filter @build-me/database db:push

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run Python Analytics Tests
        run: pnpm analytics:test

      - name: Start API for Performance Tests
        run: |
          pnpm --filter @build-me/api dev > /tmp/build-me-api.log 2>&1 &
          echo "$!" > /tmp/build-me-api.pid

          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4000/health >/dev/null; then
              echo "API is ready"
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/build-me-api.pid)" 2>/dev/null; then
              echo "API process exited before becoming ready"
              cat /tmp/build-me-api.log
              exit 1
            fi

            sleep 2
          done

          echo "API did not become ready"
          cat /tmp/build-me-api.log
          exit 1

      - name: Run Workspace Tests
        run: |
          pnpm exec turbo run test \
            --filter='!@build-me/integration-tests' \
            --filter='!@build-me/api-tests'

      - name: Build
        run: pnpm build

      - name: Stop API
        if: always()
        run: |
          if [ -f /tmp/build-me-api.pid ]; then
            kill "$(cat /tmp/build-me-api.pid)" 2>/dev/null || true
          fi

      - name: Show API Logs on Failure
        if: failure()
        run: |
          if [ -f /tmp/build-me-api.log ]; then
            cat /tmp/build-me-api.log
          fi

  e2e:
    name: Cypress E2E Tests
    runs-on: ubuntu-latest
    needs: quality

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Supabase Secrets
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::GitHub Actions secret VITE_SUPABASE_URL is missing."
            exit 1
          fi

          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::GitHub Actions secret VITE_SUPABASE_PUBLISHABLE_KEY is missing."
            exit 1
          fi

          echo "Required Supabase environment variables are present."

      - name: Start Web and Dashboard Applications
        run: |
          pnpm --filter @build-me/web dev \
            --host 127.0.0.1 --port 5173 --strictPort \
            > /tmp/build-me-web.log 2>&1 &
          echo "$!" > /tmp/build-me-web.pid

          pnpm --filter @build-me/admin dev \
            --host 127.0.0.1 --port 5174 --strictPort \
            > /tmp/build-me-dashboard.log 2>&1 &
          echo "$!" > /tmp/build-me-dashboard.pid

      - name: Wait for Applications
        run: |
          wait_for_url() {
            url="$1"
            pid_file="$2"
            log_file="$3"

            for i in $(seq 1 60); do
              if curl --fail --silent "$url" >/dev/null; then
                echo "$url is ready"
                return 0
              fi

              if [ -f "$pid_file" ] && ! kill -0 "$(cat "$pid_file")" 2>/dev/null; then
                echo "Application process exited: $url"
                cat "$log_file"
                return 1
              fi

              sleep 2
            done

            echo "Timed out waiting for $url"
            cat "$log_file"
            return 1
          }

          wait_for_url \
            http://127.0.0.1:5173 \
            /tmp/build-me-web.pid \
            /tmp/build-me-web.log

          wait_for_url \
            http://127.0.0.1:5174 \
            /tmp/build-me-dashboard.pid \
            /tmp/build-me-dashboard.log

      - name: Run Cypress E2E Tests
        run: pnpm --filter @build-me/e2e-tests exec cypress run

      - name: Upload Cypress Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: tests/e2e/cypress/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Cypress Videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: tests/e2e/cypress/videos/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Web Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-logs
          path: /tmp/build-me-web.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Dashboard Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-logs
          path: /tmp/build-me-dashboard.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop Applications
        if: always()
        run: |
          for pid_file in \
            /tmp/build-me-web.pid \
            /tmp/build-me-dashboard.pid; do
            if [ -f "$pid_file" ]; then
              kill "$(cat "$pid_file")" 2>/dev/null || true
            fi
          done

