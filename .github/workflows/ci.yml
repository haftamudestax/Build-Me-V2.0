name: CI

on:
  push:
    branches:
      - main
      - development
      - "feature/**"
  pull_request:
    branches:
      - main
      - development

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: build_me_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d build_me_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: true
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/build_me_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/build_me_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: services/analytics/uv.lock

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg
          curl -fsSL https://dl.k6.io/key.gpg \
            | sudo gpg --dearmor --yes -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
          k6 version

      - name: Run database migrations
        run: pnpm --filter @build-me/database exec drizzle-kit migrate

      - name: Build workspace
        run: pnpm build

      - name: Run lint
        run: pnpm lint

      - name: Run unit and integration tests
        run: pnpm test

      - name: Start API for performance tests
        run: |
          setsid nohup pnpm --filter @build-me/api dev \
            > /tmp/build-me-api-quality.log 2>&1 &
          echo "$!" > /tmp/build-me-api-quality.pid

      - name: Wait for API
        run: |
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4000/health > /dev/null; then
              echo "API is ready."
              exit 0
            fi

            if ! kill -0 "$(cat /tmp/build-me-api-quality.pid)" 2>/dev/null; then
              echo "API process exited unexpectedly."
              cat /tmp/build-me-api-quality.log
              exit 1
            fi

            sleep 2
          done

          echo "API did not become ready."
          cat /tmp/build-me-api-quality.log
          exit 1

      - name: Run performance tests
        run: pnpm --filter @build-me/perf-tests test

      - name: Upload API logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-quality-logs
          path: /tmp/build-me-api-quality.log
          if-no-files-found: ignore
          retention-days: 7

  e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    needs: quality

    env:
      CI: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.25.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Supabase configuration
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "::error::Missing GitHub Actions secret VITE_SUPABASE_URL."
            exit 1
          fi

          if [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::error::Missing GitHub Actions secret VITE_SUPABASE_PUBLISHABLE_KEY."
            exit 1
          fi

      - name: Start Web and Dashboard Applications
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_ANALYTICS_URL: http://127.0.0.1:5173
        run: |
          setsid nohup pnpm --filter @build-me/web dev \
            --host 127.0.0.1 --port 5173 --strictPort \
            > /tmp/build-me-web.log 2>&1 &
          echo "$!" > /tmp/build-me-web.pid

          setsid nohup pnpm --filter @build-me/admin dev \
            --host 127.0.0.1 --port 5174 --strictPort \
            > /tmp/build-me-dashboard.log 2>&1 &
          echo "$!" > /tmp/build-me-dashboard.pid

      - name: Wait for Web and Dashboard
        run: |
          wait_for_url() {
            local url="$1"
            local name="$2"
            local log_file="$3"
            local pid_file="$4"

            for i in {1..60}; do
              if curl --fail --silent "$url" > /dev/null; then
                echo "$name is ready."
                return 0
              fi

              if [ -f "$pid_file" ] &&
                 ! kill -0 "$(cat "$pid_file")" 2>/dev/null; then
                echo "$name process exited unexpectedly."
                cat "$log_file"
                return 1
              fi

              sleep 2
            done

            echo "$name did not become ready at $url."
            cat "$log_file"
            return 1
          }

          wait_for_url \
            "http://127.0.0.1:5173" \
            "Web application" \
            "/tmp/build-me-web.log" \
            "/tmp/build-me-web.pid"

          wait_for_url \
            "http://127.0.0.1:5174" \
            "Dashboard application" \
            "/tmp/build-me-dashboard.log" \
            "/tmp/build-me-dashboard.pid"

      - name: Run Cypress E2E Tests
        run: pnpm --filter @build-me/e2e-tests test:e2e

      - name: Upload Cypress screenshots and videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            tests/e2e/cypress/screenshots
            tests/e2e/cypress/videos
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload application logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-application-logs
          path: |
            /tmp/build-me-web.log
            /tmp/build-me-dashboard.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop applications
        if: always()
        run: |
          for pid_file in \
            /tmp/build-me-web.pid \
            /tmp/build-me-dashboard.pid; do
            if [ -f "$pid_file" ]; then
              pid="$(cat "$pid_file")"
              kill -- "-$pid" 2>/dev/null || kill "$pid" 2>/dev/null || true
            fi
          done
