name: Feature Branch Validation

on:
  push:
    branches:
      - "feature/**"

concurrency:
  group: feature-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

env:
  NODE_ENV: test
  VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

jobs:
  quality:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm --filter @about-me/web exec playwright install --with-deps chromium

      - name: Lint
        run: pnpm turbo run lint

      - name: Type Check
        run: pnpm turbo run typecheck

      - name: Run Unit Tests
        run: pnpm --filter @build-me/unit-tests test

      - name: Run API Tests
        run: pnpm --filter @about-me/api test

      - name: Run Database Tests
        run: pnpm --filter @build-me/database test

      - name: Run Web Tests
        run: pnpm --filter @about-me/web test

      - name: Build
        run: pnpm turbo run build

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API
        run: pnpm --filter @about-me/api build

      - name: Start API
        run: |
          pnpm --filter @about-me/api start > api.log 2>&1 &
          echo $! > api.pid

      - name: Wait for API
        run: |
          echo "Waiting for API on port 4000..."

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4000/health; then
              echo ""
              echo "API is ready."
              exit 0
            fi

            echo "Attempt $i/30: API is not ready yet..."
            sleep 1
          done

          echo ""
          echo "API failed to start."
          echo ""
          echo "===== API LOG ====="
          cat api.log || true
          echo "=================="

          exit 1

      - name: Run Integration Tests
        run: pnpm --filter @build-me/integration-tests test

      - name: Show API Logs on Failure
        if: failure()
        run: |
          echo "===== API LOG ====="
          cat api.log || true
          echo "=================="

      - name: Stop API
        if: always()
        run: |
          if [ -f api.pid ]; then
            kill "$(cat api.pid)" || true
          fi

  e2e:
    name: End-to-End Tests (Cypress)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Cypress Binary
        run: pnpm --filter @build-me/e2e-tests exec cypress install

      - name: Verify Environment Variables
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "❌ VITE_SUPABASE_URL is missing"
            exit 1
          fi

          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "❌ VITE_SUPABASE_ANON_KEY is missing"
            exit 1
          fi

          echo "✅ Supabase environment variables are configured"

      - name: Run End-to-End Tests
        run: pnpm turbo run test:e2e

  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit Dependencies
        run: pnpm audit --audit-level=high

  code-scanning:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
