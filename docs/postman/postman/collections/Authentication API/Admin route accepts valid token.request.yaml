$kind: http-request
url: "{{baseUrl}}/api/leads"
method: GET
headers:
  Authorization: Bearer {{authToken}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 with a valid token', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 3000
