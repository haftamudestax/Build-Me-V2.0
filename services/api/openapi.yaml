openapi: 3.0.3
info:
  title: Build Me Platform API
  description: REST API for the Build Me platform (public site, admin dashboard, and future services).
  version: 2.0.0
servers:
  - url: http://localhost:4000
    description: Local development
  - url: https://about-me-api-black.vercel.app
    description: Production

paths:
  /health:
    get:
      summary: System health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/leads:
    post:
      summary: Create a lead
      description: >
        Unified lead-capture endpoint — covers contact form submissions
        ("Talk To Us") and ownership area audit requests ("Get Help Free").
      operationId: createLead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Lead created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadCreated"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: List leads (admin only)
      operationId: listLeads
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/events:
    post:
      summary: Log an analytics event
      description: Public, write-only — logs page views and clicks for the admin Overview dashboard.
      operationId: createEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventInput"
      responses:
        "201":
          description: Event logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventCreated"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: List recent events (admin only)
      operationId: listEvents
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of recent events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/bookings:
    post:
      summary: Create a booking request
      description: "Work With Us — delivery project request."
      operationId: createBooking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingCreated"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      summary: List bookings (admin only)
      operationId: listBookings
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok
      required: [status]

    LeadInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        message:
          type: string
        source:
          type: string
          enum: [contact, audit_request]
      required: [name, email, message, source]

    LeadCreated:
      type: object
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, createdAt]

    Lead:
      allOf:
        - $ref: "#/components/schemas/LeadInput"
        - type: object
          properties:
            id:
              type: integer
            createdAt:
              type: string
              format: date-time

    EventInput:
      type: object
      properties:
        eventType:
          type: string
          example: page_view
        target:
          type: string
          example: /hero-cta
      required: [eventType, target]

    EventCreated:
      type: object
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, createdAt]

    Event:
      allOf:
        - $ref: "#/components/schemas/EventInput"
        - type: object
          properties:
            id:
              type: integer
            createdAt:
              type: string
              format: date-time

    BookingInput:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        projectDescription:
          type: string
        budget:
          type: string
        timeline:
          type: string
      required: [name, email, projectDescription]

    BookingCreated:
      type: object
      properties:
        id:
          type: integer
        createdAt:
          type: string
          format: date-time
      required: [id, createdAt]

    Booking:
      allOf:
        - $ref: "#/components/schemas/BookingInput"
        - type: object
          properties:
            id:
              type: integer
            createdAt:
              type: string
              format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
