$kind: http-request
name: Submit Contact Message
method: POST
url: "{{baseUrl}}/contact"
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "haftamu",
      "email": "haftamu@example.com",
      "message": "Hello, I would like to get in touch!"
    }
